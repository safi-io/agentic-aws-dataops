[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-aws-dataops"
version = "0.1.0"
description = "Agentic data engineering incident response system powered by Dagster, Strands Decider 2B, and Amazon Bedrock"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Agentic AWS DataOps Team"}]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "dagster_project*", "dataops_agent*", "dashboard*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
