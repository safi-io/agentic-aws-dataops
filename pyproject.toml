[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-aws-dataops"
version = "0.1.0"
description = "Agentic data engineering incident response system powered by Dagster, Strands Decider 2B, and Amazon Bedrock"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Agentic AWS DataOps Team"}
]
keywords = [
    "data-engineering",
    "dagster",
    "aws",
    "bedrock",
    "strands-decider-2b",
    "agentic-ai",
    "incident-response",
    "s3",
    "streamlit"
]
dependencies = [
    "dagster>=1.7.0",
    "dagster-webserver>=1.7.0",
    "pandas>=2.0.0",
    "boto3>=1.34.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.32.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dagster_project*", "dataops_agent*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

